[package]
name = "program"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
solana-program-error = "3.0.1"
solana-falcon512 = { path = ".." }

[dev-dependencies]
pqcrypto-falcon = "0.4"
pqcrypto-traits = "0.3"
mollusk-svm = "0.12.0"
solana-instruction = "3.4.0"
solana-address = "2.6.0"

[profile.release]
panic = "abort"
overflow-checks = false
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
